name: Frontend CI/CD

on:
  push:
    branches: [ develop ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set Image Tag
        run: echo "IMAGE_TAG=sha-${{ github.sha }}" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/timiroom-frontend:${{ env.IMAGE_TAG }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://api.timiroom.kro.kr
            NEXT_PUBLIC_RAG_PIPELINE_URL=https://rag.timiroom.kro.kr
            NEXT_PUBLIC_APP_URL=https://timiroom.kro.kr
            NEXT_PUBLIC_INTEGRATION_ENABLED=${{ vars.NEXT_PUBLIC_INTEGRATION_ENABLED || 'false' }}
            NEXT_PUBLIC_SLACK_ENABLED=${{ vars.NEXT_PUBLIC_SLACK_ENABLED || 'false' }}
            NEXT_PUBLIC_BUSINESS_NAME=${{ vars.NEXT_PUBLIC_BUSINESS_NAME }}
            NEXT_PUBLIC_BUSINESS_REPRESENTATIVE=${{ vars.NEXT_PUBLIC_BUSINESS_REPRESENTATIVE }}
            NEXT_PUBLIC_BUSINESS_NUMBER=${{ vars.NEXT_PUBLIC_BUSINESS_NUMBER }}
            NEXT_PUBLIC_MAIL_ORDER_NUMBER=${{ vars.NEXT_PUBLIC_MAIL_ORDER_NUMBER }}
            NEXT_PUBLIC_BUSINESS_ADDRESS=${{ vars.NEXT_PUBLIC_BUSINESS_ADDRESS }}
            NEXT_PUBLIC_BUSINESS_PHONE=${{ vars.NEXT_PUBLIC_BUSINESS_PHONE }}
            NEXT_PUBLIC_CONTACT_EMAIL=${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}
            NEXT_PUBLIC_PRIVACY_OFFICER=${{ vars.NEXT_PUBLIC_PRIVACY_OFFICER }}

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update Ops Repo image
        run: |
          git clone https://${{ secrets.GH_PAT }}@github.com/timiroom/timiroom-ops.git
          cd timiroom-ops/apps/frontend
          kustomize edit set image frontend-image=${{ secrets.DOCKER_USERNAME }}/timiroom-frontend:${{ env.IMAGE_TAG }}

          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add kustomization.yaml
          git commit -m "chore: deploy frontend image [${{ env.IMAGE_TAG }}]" || true
          git push
