name: Frontend CI/CD

on:
  push:
    branches: [ develop ]

concurrency:
  group: ops-deploy-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set Image Tag
        run: echo "IMAGE_TAG=sha-${{ github.sha }}" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/timiroom-frontend:${{ env.IMAGE_TAG }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://api.timiroom.kro.kr
            NEXT_PUBLIC_RAG_PIPELINE_URL=https://rag.timiroom.kro.kr
            NEXT_PUBLIC_APP_URL=https://timiroom.kro.kr
            NEXT_PUBLIC_INTEGRATION_ENABLED=${{ vars.NEXT_PUBLIC_INTEGRATION_ENABLED || 'false' }}
            NEXT_PUBLIC_SLACK_ENABLED=${{ vars.NEXT_PUBLIC_SLACK_ENABLED || 'false' }}
            NEXT_PUBLIC_BUSINESS_NAME=${{ vars.NEXT_PUBLIC_BUSINESS_NAME }}
            NEXT_PUBLIC_BUSINESS_REPRESENTATIVE=${{ vars.NEXT_PUBLIC_BUSINESS_REPRESENTATIVE }}
            NEXT_PUBLIC_BUSINESS_NUMBER=${{ vars.NEXT_PUBLIC_BUSINESS_NUMBER }}
            NEXT_PUBLIC_MAIL_ORDER_NUMBER=${{ vars.NEXT_PUBLIC_MAIL_ORDER_NUMBER }}
            NEXT_PUBLIC_BUSINESS_ADDRESS=${{ vars.NEXT_PUBLIC_BUSINESS_ADDRESS }}
            NEXT_PUBLIC_BUSINESS_PHONE=${{ vars.NEXT_PUBLIC_BUSINESS_PHONE }}
            NEXT_PUBLIC_CONTACT_EMAIL=${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}
            NEXT_PUBLIC_PRIVACY_OFFICER=${{ vars.NEXT_PUBLIC_PRIVACY_OFFICER }}

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.4.3"

      - name: Update Ops Repo image
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          # 토큰은 주소가 아니라 인증 헤더로 보낸다. 주소에 넣으면 GitHub가 redirect할 때 토큰이 빠져
          # 'could not read Username'으로 실패했다.
          OPS_AUTH=$(printf 'x-access-token:%s' "$GH_PAT" | base64 -w0)
          echo "::add-mask::$OPS_AUTH"
          for attempt in 1 2 3; do
            rm -rf timiroom-ops
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $OPS_AUTH" clone https://github.com/timiroom/timiroom-ops.git && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
          git -C timiroom-ops config http.https://github.com/.extraheader "AUTHORIZATION: basic $OPS_AUTH"
          cd timiroom-ops/apps/frontend
          kustomize edit set image frontend-image=${{ secrets.DOCKER_USERNAME }}/timiroom-frontend:${{ env.IMAGE_TAG }}

          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add kustomization.yaml
          git commit -m "chore: deploy frontend image [${{ env.IMAGE_TAG }}]" || true
          for attempt in 1 2 3 4 5; do
            git push && break
            if [ "$attempt" = 5 ]; then exit 1; fi
            # 다른 배포가 먼저 올렸으면 그 위에 다시 쌓고 재시도한다(서비스마다 다른 폴더라 충돌하지 않는다)
            sleep $((attempt * 3))
            git pull --rebase
          done